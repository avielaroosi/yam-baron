<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- נתיבים כפולים: אם משנים hero/logo ב-js/content.js צריך לעדכן גם את שתי השורות האלה -->
  <link rel="preload" as="image" href="assets/img/hero.jpg" fetchpriority="high">
  <link rel="preload" as="image" href="assets/brand/logo-full-light.svg" fetchpriority="high">

  <!-- שער אנימציית הפתיחה. inline וסינכרוני בכוונה: הוא חייב לצבוע את השחור לפני
       שההירו נצבע, ואותו קוד עצמו מחזיק גם את רשת הביטחון שמנקה אותו. לכן בלי JS
       שום דבר לא נדרך מלכתחילה, והדף פשוט מוצג כרגיל. -->
  <style>
    html.intro-armed { overflow: hidden; }
    html.intro-armed::before { content: ""; position: fixed; inset: 0; z-index: 300; background: #0b0b0b; }
  </style>
  <script>
    (function () {
      try {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        if (sessionStorage.getItem("yb-intro") === "seen") return;
        sessionStorage.setItem("yb-intro", "seen"); // נשמר עכשיו: רענון באמצע הפתיחה לא מנגן אותה שוב
        var h = document.documentElement;
        h.classList.add("intro-armed");
        setTimeout(function () { h.classList.remove("intro-armed"); }, 3000); // js/intro.js לא הגיע
      } catch (e) { /* אין sessionStorage (גלישה פרטית): מדלגים על הפתיחה ומציגים את הדף */ }
    })();
  </script>
  <title>YAM BARON | Hair Studio — עיצוב שיער, כלות והחלקות</title>
  <meta name="description" content="YAM BARON Hair Studio: סטודיו בוטיק לעיצוב שיער. עיצוב כלות, תסרוקות לאירועים והחלקות. לתיאום תור בוואטסאפ.">
  <meta name="theme-color" content="#0b0b0b">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="he_IL">
  <meta property="og:site_name" content="YAM BARON | Hair Studio">
  <meta property="og:title" content="YAM BARON | Hair Studio">
  <meta property="og:description" content="עיצוב שיער · כלות · החלקות. לתיאום תור בוואטסאפ.">
  <meta property="og:image" content="https://avielaroosi.github.io/yam-baron/assets/img/hero.jpg">
  <meta property="og:url" content="https://avielaroosi.github.io/yam-baron/">
  <link rel="icon" href="assets/favicon.png" type="image/png" sizes="256x256">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Assistant:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#services">דלג לתוכן</a>

  <header class="hero" id="top">
    <div class="hero__media">
      <video class="hero__video is-ambient" id="hero-video" muted loop playsinline preload="none"></video>
      <img class="hero__bg" id="hero-img" fetchpriority="high" alt="">
    </div>
    <div class="hero__inner">
      <img class="hero__logo" id="hero-logo" fetchpriority="high" alt="">
      <h1 class="sr-only" id="hero-name"></h1>
      <p class="sr-only" id="hero-sub"></p>
      <p class="hero__tagline" id="hero-tagline"></p>
      <p class="hero__text" id="hero-text"></p>
    </div>
    <a class="hero__scroll" href="#services" aria-label="גלילה למטה">↓</a>
  </header>

  <main>
    <section class="section section--ink-1 reveal" id="services">
      <div class="container">
        <h2 class="section__title">השירותים</h2>
        <div class="cards" id="services-grid"></div>
      </div>
    </section>

    <section class="section section--light reveal" id="gallery">
      <div class="container">
        <h2 class="section__title">עבודות</h2>
        <div class="gallery" id="gallery-grid"></div>
      </div>
    </section>

    <section class="section section--ink-1 reveal" id="videos">
      <div class="container">
        <h2 class="section__title">סרטונים</h2>
        <div class="videos" id="videos-grid"></div>
      </div>
    </section>

    <section class="section section--dark section--divided reveal" id="testimonials">
      <div class="container">
        <h2 class="section__title">המלצות</h2>
        <p class="testimonials__empty" id="testimonials-empty">המלצות של לקוחות יעלו כאן בקרוב</p>
        <div class="testimonials" id="testimonials-grid"></div>
      </div>
    </section>

    <section class="section--ink-1 reveal gift-band" id="gift-band" hidden>
      <img class="gift-band__img" id="gift-band-img" alt="" loading="lazy">
      <div class="container gift-band__inner">
        <p class="gift-band__eyebrow" id="gift-band-eyebrow"></p>
        <h2 class="gift-band__title" id="gift-band-title"></h2>
        <button class="btn btn--gold btn--big" id="gift-band-cta" type="button"></button>
      </div>
    </section>

    <section class="section section--light reveal" id="about">
      <div class="container about">
        <img class="about__img" id="about-img" alt="" loading="lazy">
        <div class="about__body">
          <h2 class="section__title" id="about-title"></h2>
          <div class="about__text" id="about-text"></div>
        </div>
      </div>
    </section>

    <section class="section section--ink-1 reveal" id="contact">
      <div class="container">
        <h2 class="section__title">יצירת קשר</h2>
        <div class="contact">
          <div class="contact__info">
            <div class="contact__actions">
              <a class="btn btn--wa btn--big" id="contact-wa" href="#" target="_blank" rel="noopener">לתיאום תור בוואטסאפ</a>
            </div>
            <div class="contact__secondary">
              <a id="contact-ig" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg><span>אינסטגרם</span></a>
              <a id="contact-waze" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 20 20 12 16 4 20z"/></svg><span>נווט בוויז</span></a>
            </div>
            <ul class="contact__list">
              <li><a id="contact-tel" href="#"></a></li>
              <li id="contact-address"></li>
            </ul>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <img class="footer__logo" id="footer-logo" alt="">
    <p><span class="wordmark wordmark--sm" id="footer-name"></span> · <span class="footer__year" id="footer-year"></span></p>
  </footer>

  <a class="wa-fab" id="wa-fab" href="#" target="_blank" rel="noopener" aria-label="וואטסאפ">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M16 3C9.4 3 4 8.3 4 14.9c0 2.3.7 4.5 1.9 6.4L4 29l7.9-2.1c1.8 1 3.9 1.5 6.1 1.5 6.6 0 12-5.3 12-11.9S22.6 3 16 3zm0 21.7c-1.9 0-3.8-.5-5.4-1.5l-.4-.2-4.7 1.2 1.3-4.5-.3-.4A9.7 9.7 0 0 1 6.2 15c0-5.4 4.4-9.8 9.8-9.8s9.8 4.4 9.8 9.8-4.4 9.7-9.8 9.7zm5.4-7.3c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-1 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5.3-.5c.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 1.9.8 2.6.9 3.5.7.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4z"/></svg>
  </a>

  <div class="promo" id="promo" hidden role="dialog" aria-modal="true" aria-labelledby="promo-eyebrow">
    <div class="promo__card">
      <button class="promo__close" id="promo-close" type="button" aria-label="סגירה">×</button>
      <div class="promo__visual" id="promo-visual"><img class="promo__img" id="promo-img" alt="" loading="lazy"></div>
      <div class="promo__body">
        <p class="promo__eyebrow" id="promo-eyebrow"></p>
        <p class="promo__big"><span class="promo__big-num" id="promo-big"></span><span class="promo__big-label" id="promo-big-label"></span></p>
        <p class="promo__subtitle" id="promo-subtitle"></p>
        <div class="promo__text" id="promo-text"></div>
        <p class="promo__highlight" id="promo-highlight"></p>
        <a class="btn btn--gold promo__cta" id="promo-cta" href="#" target="_blank" rel="noopener"></a>
        <p class="promo__fine" id="promo-fine"></p>
      </div>
    </div>
  </div>

  <!-- גיפט קארד: אותו כרטיס כמו הפופאפ של ההטבה (מחלקות promo__*), נפתח מכפתור הבאנר או מהכתובת ?gift -->
  <div class="promo promo--gift" id="gift" hidden role="dialog" aria-modal="true" aria-labelledby="gift-title">
    <div class="promo__card">
      <button class="promo__close" id="gift-close" type="button" aria-label="סגירה">×</button>
      <div class="promo__visual promo__visual--photo"><img class="promo__img" id="gift-img" alt="" loading="lazy"></div>
      <div class="promo__body">
        <p class="gift__eyebrow" id="gift-eyebrow"></p>
        <h2 class="gift__title" id="gift-title"></h2>
        <div class="promo__text" id="gift-text"></div>
        <p class="gift__closing" id="gift-closing"></p>
        <a class="btn btn--gold promo__cta" id="gift-cta" href="#" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="תצוגת תמונה">
    <button class="lightbox__close" id="lightbox-close" type="button" aria-label="סגירה">×</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" type="button" aria-label="הקודמת">›</button>
    <img class="lightbox__img" id="lightbox-img" alt="">
    <button class="lightbox__nav lightbox__nav--next" id="lightbox-next" type="button" aria-label="הבאה">‹</button>
    <p class="lightbox__count" id="lightbox-count"></p>
  </div>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
  <!-- אחרי main.js: הפתיחה נוחתת על לוגו ההירו, וצריך ש-renderHero כבר יציב לו src -->
  <script src="js/intro.js"></script>
</body>
</html>
